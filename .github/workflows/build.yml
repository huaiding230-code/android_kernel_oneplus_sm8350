name: Phase 2 - Integrated SukiSU Ultra + SUSFS Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048

      # 1. 拉取 LineageOS 内核源码
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          path: kernel_source
          fetch-depth: 1

      # 2. 拉取 Proton-Clang 工具链
      - name: Setup Proton-Clang Toolchain
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/huaiding230-code/proton-clang.git toolchain/proton-clang
          echo "${GITHUB_WORKSPACE}/toolchain/proton-clang/bin" >> $GITHUB_PATH

      # 3. 拉取 SukiSU-Ultra 并运行 setup.sh
      - name: Integrate SukiSU Ultra + SUSFS
        run: |
          set -euo pipefail
          cd kernel_source

          echo "========================================"
          echo "拉取 SukiSU Ultra 仓库并自动运行集成脚本"
          echo "========================================"
          git clone --depth=1 https://github.com/huaiding230-code/SukiSU-Ultra KernelSU
          bash KernelSU/kernel/setup.sh

          # 1. 强行将 kernelsu 的 Makefile 中的条件编译改为 obj-y
          sed -i 's/obj-$(CONFIG_KSU)/obj-y/g' drivers/kernelsu/Makefile || true
          sed -i 's/obj-$(CONFIG_KSU)/obj-y/g' KernelSU/kernel/Makefile || true

          # 强制在 drivers/Makefile 和 fs/Makefile 追加无条件编译，防止被 .config 擦除
          if ! grep -q "obj-y += kernelsu/" drivers/Makefile; then
            echo 'obj-y += kernelsu/' >> drivers/Makefile
          fi
          if ! grep -q "obj-y += susfs.o" fs/Makefile; then
            echo 'obj-y += susfs.o' >> fs/Makefile
          fi

      # 4. 构建集成内核
      - name: Build Integrated Kernel
        run: |
          set -euo pipefail
          cd kernel_source

          # 配置 Clang 工具链路径
          CLANG_DIR="${GITHUB_WORKSPACE}/toolchain/proton-clang"
          export PATH="${CLANG_DIR}/bin:${PATH}"

          # 准备干净的输出目录
          OUT_DIR="${GITHUB_WORKSPACE}/out"
          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"

          DEFCONFIG_TARGET="vendor/lahaina-qgki_defconfig"

          echo "========================================"
          echo "1. 解锁 Kconfig 隐式配置限制"
          echo "========================================"
          if [ -f "net/core/Kconfig" ]; then
            sed -i 's/^config RPS$/config RPS\n\tprompt "Receive Packet Steering"/g' net/core/Kconfig
          fi

          echo "========================================"
          echo "2. 确保 drivers/Kconfig 正确引用 KSU"
          echo "========================================"
          if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi

          DEFCONFIG_PATH="arch/arm64/configs/vendor/lahaina-qgki_defconfig"

          echo "========================================"
          echo "3. 向 target defconfig 注入所有功能与优化配置"
          echo "========================================"
          cat << 'EOF' >> "${DEFCONFIG_PATH}"

          # SukiSU Ultra & SUSFS 配置
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SPOOF_CPU=y

          # 底层网络与安全依赖
          CONFIG_NET=y
          CONFIG_INET=y
          CONFIG_KEYS=y
          CONFIG_PERF_EVENTS=y

          # 禁用调试标志以提升编译速度与缩减镜像体积
          CONFIG_DEBUG_INFO=n
          CONFIG_DEBUG_INFO_DWARF4=n
          CONFIG_DEBUG_INFO_NONE=y
          CONFIG_DEBUG_INFO_BTF=n
          EOF

          MAKE_ARGS=(
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC=clang
            KCFLAGS="-Wno-unused-function ${EXTRA_FLAGS}"
            KLDFLAGS="-Wl,--thinlto-jobs=$(nproc)"
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            O="${OUT_DIR}"
          )

          echo "========================================"
          echo "4. 生成并校验 .config"
          echo "========================================"
          make "${MAKE_ARGS[@]}" vendor/lahaina-qgki_defconfig

          # 校验 CONFIG_KSU 是否在 .config 中成功保留
          if ! grep -q "CONFIG_KSU=y" "${OUT_DIR}/.config"; then
            echo "[-] 错误：CONFIG_KSU 未能在 .config 中生效！"
            exit 1
          fi
          echo "[+] CONFIG_KSU 已成功写入 .config！"

          echo "========================================"
          echo "5. 开始多核极速编译内核"
          echo "========================================"
          make -k "${MAKE_ARGS[@]}" -j"$(nproc)"

      # 5. 打包 AnyKernel3
      - name: Pack with AnyKernel3
        shell: bash
        run: |
          set -e
          cd "${GITHUB_WORKSPACE}"

          git clone --depth=1 https://github.com/huaiding230-code/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          rm -rf .git README.md *placeholder

          sed -i -E 's/^[[:space:]]*do\.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          sed -i -E 's/^[[:space:]]*(BLOCK|block)=.*/BLOCK=\/dev\/block\/bootdevice\/by-name\/boot;/' anykernel.sh
          sed -i -E 's/^[[:space:]]*(IS_SLOT_DEVICE|is_slot_device)=.*/IS_SLOT_DEVICE=1;/' anykernel.sh

          echo "========================================"
          echo "提取内核镜像产物"
          echo "========================================"
          OUT_DIR="${GITHUB_WORKSPACE}/out"

          if [ -f "${OUT_DIR}/arch/arm64/boot/dtb" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/dtb" ./
            echo "[+] 已提取 dtb"
          fi
          if [ -f "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" ./
            echo "[+] 已提取 Image.gz-dtb"
          elif [ -f "${OUT_DIR}/arch/arm64/boot/Image" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image" ./
            echo "[+] 已提取 Image"
          else
            echo "[-] 致命错误：未找到支持的内核镜像文件！"
            exit 1
          fi

      # 6. 上传 Artifact
      - name: Upload Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-SUSFS-Kernel
          path: AnyKernel3/*
