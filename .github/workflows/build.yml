name: Phase 2 - Integrated SukiSU Ultra + SUSFS Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048

      # 1. 拉取 LineageOS 内核源码
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          path: kernel_source
          fetch-depth: 1

      # 2. 拉取 Proton-Clang 工具链
      - name: Setup Proton-Clang Toolchain
        run: |
          mkdir -p toolchain
          git clone --depth=1 https://github.com/huaiding230-code/proton-clang.git toolchain/proton-clang
          echo "${GITHUB_WORKSPACE}/toolchain/proton-clang/bin" >> $GITHUB_PATH
          
      - name: Integrate SukiSU Ultra + SUSFS
        run: |
          set -euo pipefail
          cd kernel_source
          
          echo "========================================"
          echo "1. 克隆你个人仓库的 SukiSU Ultra 与 susfs4ksu"
          echo "========================================"
          
          rm -rf /tmp/SukiSU-Ultra /tmp/susfs4ksu
          git clone --depth=1 https://github.com/huaiding230-code/SukiSU-Ultra.git /tmp/SukiSU-Ultra
          git clone --depth=1 https://github.com/huaiding230-code/susfs4ksu.git /tmp/susfs4ksu
          
          echo "========================================"
          echo "2. 清理 dts 设备树冲突节点"
          echo "========================================"
          git checkout -- arch/arm64/boot/dts/ || true
          
          echo "========================================"
          echo "3. 执行你魔改过的 setup.sh (全权交由你的库处理)"
          echo "========================================"
          bash /tmp/SukiSU-Ultra/kernel/setup.sh
          
          echo "========================================"
          echo "4. 从 susfs4ksu 注入 SUSFS 模块与 5.4 Patch"
          echo "========================================"
          if [ -f "/tmp/susfs4ksu/kernel_patches/fs/susfs.c" ]; then
            cp /tmp/susfs4ksu/kernel_patches/fs/susfs.c fs/
            echo "[+] 成功复制 susfs.c 到 fs/"
          else
            echo "[-] 致命错误: 未找到 susfs.c" && exit 1
          fi
          find /tmp/susfs4ksu -name "susfs*.h" -exec cp {} include/linux/ \;
          echo "[+] 成功复制 susfs 头文件到 include/linux/"
          
          # 仅挂载 susfs.o（千万不要挂载 sus_su.o）
          if ! grep -q "susfs.o" fs/Makefile; then
            echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile
          fi
          # 4. 插入到 fs/Kconfig 的 endmenu 上方（保证在作用域内）
          if ! grep -q "CONFIG_KSU_SUSFS" fs/Kconfig; then
            sed -i '/^endmenu/i \
            config KSU_SUSFS\
            \tbool "SUSFS support"\
            \tdefault y\
            ' fs/Kconfig
          fi
          
      # 4. 构建集成内核
      - name: Build Integrated Kernel
        run: |
          set -euo pipefail
          cd kernel_source
          CLANG_DIR="${GITHUB_WORKSPACE}/toolchain/proton-clang"
          export PATH="${CLANG_DIR}/bin:${PATH}"
          OUT_DIR="${GITHUB_WORKSPACE}/out"
          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"
       
          echo "========================================"
          echo "1. 指定一加9 (lahaina-qgki) 配置文件路径"
          echo "========================================"
          DEFCONFIG_FILE="arch/arm64/configs/vendor/lahaina-qgki_defconfig"
          DEFCONFIG_TARGET="vendor/lahaina-qgki_defconfig"

          if [ ! -f "${DEFCONFIG_FILE}" ]; then
            echo "ERROR: 未找到配置文件 ${DEFCONFIG_FILE}！"
            exit 1
          fi
          echo "指定配置文件: ${DEFCONFIG_FILE}"
          
          echo "========================================"
          echo "2. 注入 SukiSU/SUSFS 及其核心依赖 Config 到 defconfig"
          echo "========================================"
          # 必须先追加到源 defconfig 文件，然后再执行 make
          cat << 'EOF' >> "${DEFCONFIG_FILE}"

          # SukiSU / SUSFS / Security Configurations
          CONFIG_NET=y
          CONFIG_RPS=y
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SPOOF_CPU=y
          CONFIG_KSU_SUCOMPAT=y
          CONFIG_KSU_SULOG=y
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_SECURITY=y
          CONFIG_SECURITY_SELINUX=y
          CONFIG_SECURITYFS=y
          # CONFIG_IOMMU_DEBUG is not set
          # CONFIG_IOMMU_DEBUGFS is not set
          # CONFIG_MEM_SHARE_QMI_SERVICE is not set
          # 强制将一加触控驱动编入内核主体，彻底规避 modpost undefined 报错
          CONFIG_TOUCHSCREEN_OPLUS_TP_V2=y
          EOF

          MAKE_ARGS=(
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC=clang
            KCFLAGS="-Wno-unused-function"
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            O="${OUT_DIR}"
          )

          echo "========================================"
          echo "3. 生成包含注入 Config 的最终 .config"
          echo "========================================"
          make "${MAKE_ARGS[@]}" "${DEFCONFIG_TARGET}"

          echo "========================================"
          echo "4. 执行 olddefconfig 与核心配置强校验"
          echo "========================================"
          make "${MAKE_ARGS[@]}" olddefconfig

          # 在 Actions 日志中校验 KSU / SUSFS 是否成功开启
          grep -E '^CONFIG_KSU(=|_)' "${OUT_DIR}/.config" || true

          echo "========================================"
          echo "DEBUG: KernelSU source layout"
          echo "========================================"
          
          echo "--- drivers/kernelsu ---"
          ls -ld drivers/kernelsu
          readlink -f drivers/kernelsu || true
          
          echo "--- KernelSU Makefile ---"
          ls -l drivers/kernelsu/Makefile
          grep -n -A30 '^kernelsu-y' drivers/kernelsu/Makefile
          
          echo "--- SELinux source files ---"
          find drivers/kernelsu/selinux -maxdepth 1 -type f -print | sort
          
          echo "--- CONFIG_KSU ---"
          grep '^CONFIG_KSU=' "${OUT_DIR}/.config" || true
          
          echo "--- CONFIG_KSU_SUSFS ---"
          grep '^CONFIG_KSU_SUSFS=' "${OUT_DIR}/.config" || true
          
          echo "--- generated Kbuild command check ---"
          make "${MAKE_ARGS[@]}" -n drivers/kernelsu/kernelsu.o 2>&1 | grep -E 'selinux|kernelsu|rules|sepolicy' || true

          echo "========================================"
          echo "DEBUG: KernelSU parent Kbuild registration"
          echo "========================================"
          
          echo "--- drivers/Makefile ---"
          grep -n -C 5 "kernelsu" drivers/Makefile || true
          
          echo "--- common/drivers/Makefile ---"
          if [ -f common/drivers/Makefile ]; then
              grep -n -C 5 "kernelsu" common/drivers/Makefile || true
          fi
          
          echo "--- drivers/Kconfig ---"
          grep -n -C 5 "kernelsu" drivers/Kconfig || true
          
          echo "--- common/drivers/Kconfig ---"
          if [ -f common/drivers/Kconfig ]; then
              grep -n -C 5 "kernelsu" common/drivers/Kconfig || true
          fi
          
          echo "--- all KernelSU parent registrations ---"
          grep -R -n -E 'obj-[ym].*kernelsu|source.*kernelsu' \
              drivers/Makefile drivers/Kconfig common/drivers/Makefile common/drivers/Kconfig \
              2>/dev/null || true
              
          echo "========================================"
          echo "5. Kbuild 准备"
          echo "========================================"
          make "${MAKE_ARGS[@]}" -j1 prepare
          make "${MAKE_ARGS[@]}" -j1 scripts
          
          echo "========================================"
          echo "6. 开启全核并发编译"
          echo "========================================"
          
          set +e
          make "${MAKE_ARGS[@]}" -j"$(nproc)"
          BUILD_STATUS=$?
          set -e
          
          echo "========================================"
          echo "7. 检查 SUSFS 目标文件和符号"
          echo "========================================"
          
          find "${OUT_DIR}" \( -name 'selinux.o' -o -name 'kernelsu.o' \) -print
          
          find "${OUT_DIR}" -name '*.o' -print0 | \
            xargs -0 llvm-nm -A 2>/dev/null | \
            grep 'susfs_is_current_' || true
          
          exit "${BUILD_STATUS}"
          
      # 5. 打包 AnyKernel3
      - name: Pack with AnyKernel3
        shell: bash
        run: |
          set -e
          cd "${GITHUB_WORKSPACE}"
          git clone --depth=1 https://github.com/huaiding230-code/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          rm -rf .git README.md *placeholder
          sed -i -E 's/^[[:space:]]*do\.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          sed -i -E 's/^[[:space:]]*(BLOCK|block)=.*/BLOCK=\/dev\/block\/bootdevice\/by-name\/boot;/' anykernel.sh
          sed -i -E 's/^[[:space:]]*(IS_SLOT_DEVICE|is_slot_device)=.*/IS_SLOT_DEVICE=1;/' anykernel.sh
          echo "========================================"
          echo "提取内核镜像产物"
          echo "========================================"
          OUT_DIR="${GITHUB_WORKSPACE}/out"
          if [ -f "${OUT_DIR}/arch/arm64/boot/dtb" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/dtb" ./
            echo "[+] 已提取 dtb"
          fi
          if [ -f "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" ./
            echo "[+] 已提取 Image.gz-dtb"
          elif [ -f "${OUT_DIR}/arch/arm64/boot/Image" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image" ./
            echo "[+] 已提取 Image"
          else
            echo "[-] 致命错误：未找到支持的内核镜像文件！"
            exit 1
          fi
      # 6. 上传 Artifact
      - name: Upload Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-SUSFS-Kernel
          path: AnyKernel3/*
