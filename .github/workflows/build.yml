name: Phase 2 - LineageOS Kernel with SukiSU and SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. 清理空间以防编译过程中磁盘塞满
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048

      # 2. 拉取内核源码与你的 patch 文件夹
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          path: kernel_source 
          fetch-depth: 1

      # 3. 准备 Proton-Clang 工具链
      - name: Setup Proton-Clang Toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang
          echo "${GITHUB_WORKSPACE}/toolchain/proton-clang/bin" >> "${GITHUB_PATH}"
     
      - name: Integrate SukiSU Ultra + SUSFS
        run: |
          set -euo pipefail
          cd kernel_source
  
          echo "========================================"
          echo "1. 克隆 SukiSU-Ultra 并执行 setup.sh"
          echo "========================================"
          git clone --depth=1 https://github.com/huaiding230-code/SukiSU-Ultra KernelSU
          bash KernelSU/kernel/setup.sh main
  
          echo "========================================"
          echo "2. 修复 KernelSU 头文件路径与兼容性问题"
          echo "========================================"
          # A. 遍历 drivers/kernelsu 下所有 Makefile，为子目录递归注入包含路径与预预处理宏定义
          find drivers/kernelsu -name "Makefile" | while read -r mk; do
            echo 'ccflags-y += -I$(srctree)/$(src) -I$(srctree)/$(src)/../include -I$(srctree)/$(src)/../include/uapi -I$(srctree)/$(src)/../feature -include linux/types.h -include linux/kernel.h -include linux/printk.h -include linux/version.h' >> "$mk"
          done
  
          # B. 为裸写文件 sulog.c 顶端插入基础内核头文件、真正的内核 feature.h 以及同目录的 sulog.h（消除 incomplete type 与未定义函数报错）
          if [ -f "drivers/kernelsu/feature/sulog.c" ]; then
            sed -i '1i #include <linux/types.h>\n#include <linux/kernel.h>\n#include <linux/printk.h>\n#include <linux/init.h>\n#include <linux/version.h>\n#include "feature.h"\n#include "sulog.h"' drivers/kernelsu/feature/sulog.c
            echo "已成功为 sulog.c 注入完整头文件依赖"
          fi
  
          # C. 强制在 ksu.h 顶端注入 linux/version.h，解决 KERNEL_VERSION 宏未定义报错
          if [ -f "drivers/kernelsu/include/ksu.h" ]; then
            sed -i '1i #include <linux/version.h>' drivers/kernelsu/include/ksu.h
            echo "已成功修复 ksu.h 宏依赖"
          fi
  
          # D. 强制在 selinux.h 顶端注入 linux/version.h，解决 LINUX_VERSION_CODE 未定义报错
          if [ -f "drivers/kernelsu/selinux/selinux.h" ]; then
            sed -i '1i #include <linux/version.h>' drivers/kernelsu/selinux/selinux.h
            echo "已成功修复 selinux.h 宏依赖"
          fi
  
          # E. 注释 init.c 中未定义的函数调用（解决 5.4 内核不兼容的 app_profile 与 lsm_hook 函数调用）
          if [ -f "drivers/kernelsu/core/init.c" ]; then
            sed -i 's/\(ksu_app_profile_init();\)/\/\* \1 \*\//g' drivers/kernelsu/core/init.c
            sed -i 's/\(ksu_lsm_hook_exit();\)/\/\* \1 \*\//g' drivers/kernelsu/core/init.c
            echo "已屏蔽 init.c 中的不兼容函数"
          fi
  
          # F. 清空 5.4 内核不兼容的 kernel_umount.c（防止编译时报缺失定义错误）
          if [ -f "drivers/kernelsu/feature/kernel_umount.c" ]; then
            > drivers/kernelsu/feature/kernel_umount.c
            echo "已清空不兼容的 kernel_umount.c"
          fi
  
          echo "========================================"
          echo "3. 注入 SUSFS 模块到内核主树"
          echo "========================================"
          # 创建 SUSFS 所需的基础目录，并从远端拉取仓库
          mkdir -p fs include/linux
          rm -rf /tmp/susfs4ksu
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
  
          # 移动 susfs.c 到 fs 源码目录
          SUSFS_C=$(find /tmp/susfs4ksu -name "susfs.c" | head -n 1)
          if [ -n "$SUSFS_C" ]; then
            cp "$SUSFS_C" fs/
          else
            echo "[-] 错误: 未找到 susfs.c" && exit 1
          fi
  
          # 复制所有 susfs 头文件到 include/linux 目录
          find /tmp/susfs4ksu -name "susfs*.h" -exec cp {} include/linux/ \;
  
          # 将 susfs 编译项注入到 fs/Makefile 和 fs/Kconfig 中
          if ! grep -q "susfs.o" fs/Makefile; then
            echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile
          fi
  
          if ! grep -q "CONFIG_KSU_SUSFS" fs/Kconfig; then
            echo -e '\nconfig KSU_SUSFS\n\tbool "SUSFS support"\n\tdefault y\n' >> fs/Kconfig
          fi
  
          echo "SukiSU-Ultra 和 SUSFS 整合完毕。"
          
      - name: Build Integrated Kernel
        run: |
          set -euo pipefail
          cd kernel_source
          
          # 配置 Clang 工具链路径
          CLANG_DIR="${GITHUB_WORKSPACE}/toolchain/proton-clang"
          export PATH="${CLANG_DIR}/bin:${PATH}"
          
          # 准备干净的输出目录
          OUT_DIR="${GITHUB_WORKSPACE}/out"
          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"
  
          echo "========================================"
          echo "1. 解锁 Kconfig 隐式配置限制 (防止网络模块报错)"
          echo "========================================"
          if [ -f "net/core/Kconfig" ]; then
            sed -i 's/^config RPS$/config RPS\n\tprompt "Receive Packet Steering"/g' net/core/Kconfig
          fi
  
          echo "========================================"
          echo "2. 配置 LineageOS Target Defconfig"
          echo "========================================"
          # 直接指定你一加9 LineageOS 的配置文件
          DEFCONFIG_TARGET="vendor/lahaina-qgki_defconfig"
          echo "使用配置文件: ${DEFCONFIG_TARGET}"
  
          # 定义编译参数
          MAKE_ARGS=(
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            CC=clang
            KCFLAGS="-Wno-unused-function"
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            O="${OUT_DIR}"
          )
  
          # 加载基础配置
          make "${MAKE_ARGS[@]}" "${DEFCONFIG_TARGET}"
  
          echo "========================================"
          echo "3. 使用 scripts/config 强力注入 SukiSU/SUSFS 配置"
          echo "========================================"
          CONFIG_TOOL="scripts/config"
          if [ -f "${CONFIG_TOOL}" ]; then
            chmod +x "${CONFIG_TOOL}"
            
            # --- 解决编译未定义的底层网络与安全依赖 ---
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_NET
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_INET
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KEYS
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_PERF_EVENTS
          
            # --- 全面开启 SukiSU Ultra & SUSFS 的各项功能 ---
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_SUS_PATH
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_SUS_MOUNT
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_SUS_KSTAT
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_TRY_UMOUNT
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_SPOOF_UNAME
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_ENABLE_LOG
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SUSFS_OPEN_REDIRECT
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SPOOF_CPU
            "${CONFIG_TOOL}" --file "${OUT_DIR}/.config" --enable CONFIG_KSU_SELINUX_HIDE
          fi

          # 统一刷新并生成最终的 autoconf.h 头文件
          make "${MAKE_ARGS[@]}" olddefconfig
          
          echo "========================================"
          echo "4. 核心配置状态安全校验"
          echo "========================================"
          grep -q "CONFIG_KSU_SUSFS=y" "${OUT_DIR}/.config" || { echo "ERROR: CONFIG_KSU_SUSFS 未成功启用！"; exit 1; }
  
          echo "========================================"
          echo "5. 开始多核极速编译内核"
          echo "========================================"
          make "${MAKE_ARGS[@]}" -j"$(nproc)"
          
      # 9. 用 AnyKernel3 制作卡刷包
      - name: Pack with AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          rm -rf .git README.md *placeholder
          
          sed -i -E 's/^[[:space:]]*do\.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          sed -i -E 's/^[[:space:]]*(BLOCK|block)=.*/BLOCK=\/dev\/block\/bootdevice\/by-name\/boot;/' anykernel.sh
          sed -i -E 's/^[[:space:]]*(IS_SLOT_DEVICE|is_slot_device)=.*/IS_SLOT_DEVICE=1;/' anykernel.sh
          
          OUT_DIR="${GITHUB_WORKSPACE}/out"
          if [ -f "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" ./
          elif [ -f "${OUT_DIR}/arch/arm64/boot/Image" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image" ./
          else
            echo "ERROR: Kernel image was not found."
            exit 1
          fi

      # 10. 上传成品
      - name: Upload Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lineage-SukiSU-SUSFS-Kernel
          path: AnyKernel3/*
