name: Phase 2 - LineageOS Kernel with SukiSU and SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # 1. 清理空间以防编译过程中磁盘塞满
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048

      # 2. 拉取内核源码与你的 patch 文件夹
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          ref: lineage-23.2
          path: kernel_source 
          fetch-depth: 1

      # 3. 准备 Proton-Clang 工具链
      - name: Setup Proton-Clang Toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang
          echo "${GITHUB_WORKSPACE}/toolchain/proton-clang/bin" >> "${GITHUB_PATH}"

      # 4. 植入 SukiSU 源码 (Builtin 模式)
      - name: Integrate SukiSU Builtin
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/kernel_source"
          echo "========================================"
          echo "Integrating SukiSU Builtin"
          echo "========================================"
          
          curl -fsSL "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          
          if [ ! -d "KernelSU" ] || [ ! -f "KernelSU/kernel/Kconfig" ] || [ ! -L "drivers/kernelsu" ]; then
            echo "ERROR: SukiSU integration failed."
            exit 1
          fi
          echo "SukiSU Builtin integration completed."

      # 5. 准备 SUSFS 源码文件 (智能通配符模式)
      - name: Prepare SUSFS Files
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/kernel_source"
          echo "========================================"
          echo "Preparing SUSFS source files"
          echo "========================================"
          
          # 创建内核中的目标文件夹
          mkdir -p fs include/linux
          
          # 自动复制你分类好的文件夹内的所有内容
          # 当你后续上传 susfs_def.h 到 patch/include/linux/ 后，这里会自动将其复制过去
          cp -rv patch/fs/* fs/
          cp -rv patch/include/linux/* include/linux/
          
          echo "SUSFS source files copied."

      # 6. 为 SukiSU/KernelSU 打对接 SUSFS 的补丁
      - name: Apply SUSFS KernelSU Patch
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/kernel_source"
          echo "========================================"
          echo "Applying SUSFS KernelSU patch"
          echo "========================================"
          
          # 路径更新为你重构后的 patch/KernelSU/ 目录
          KSU_PATCH="${GITHUB_WORKSPACE}/kernel_source/patch/KernelSU/10_enable_susfs_for_ksu.patch"
          
          if [ -f "${KSU_PATCH}" ]; then
            if git -C KernelSU apply --check "${KSU_PATCH}"; then
              git -C KernelSU apply "${KSU_PATCH}"
              echo "KernelSU SUSFS patch applied."
            else
              echo "ERROR: KernelSU SUSFS patch does not apply or is already applied."
            fi
          else
            echo "KernelSU SUSFS patch not found. Skipping."
          fi

      # 7. 为内核底层文件打 SUSFS 核心补丁
      - name: Apply SUSFS 5.4 Kernel Patch
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/kernel_source"
          
          SUSFS_PATCH="patch/50_add_susfs_in_kernel-5.4.patch"
          echo "========================================"
          echo "Applying SUSFS 5.4 kernel patch"
          echo "========================================"
          
          if git apply --check "${SUSFS_PATCH}"; then
            git apply --verbose "${SUSFS_PATCH}"
            echo "SUSFS patch applied successfully."
          elif git apply --reverse --check "${SUSFS_PATCH}"; then
            echo "SUSFS patch is already applied."
          else
            echo "Patch does not apply cleanly. Generating reject files..."
            git apply --reject --whitespace=nowarn "${SUSFS_PATCH}" || true
            exit 1
          fi

      # 8. 编译内核
      - name: Build LineageOS Kernel
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/kernel_source"
          
          CLANG_DIR="${GITHUB_WORKSPACE}/toolchain/proton-clang"
          export PATH="${CLANG_DIR}/bin:${PATH}"
          
          OUT_DIR="${GITHUB_WORKSPACE}/out"
          mkdir -p "${OUT_DIR}"
          
          DEFCONFIG="vendor/lahaina-qgki_defconfig"
          MAKE_ARGS=(ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- O="${OUT_DIR}")
          
          make "${MAKE_ARGS[@]}" mrproper
          make "${MAKE_ARGS[@]}" "${DEFCONFIG}"
          CONFIG_FILE="${OUT_DIR}/.config"
          
          set_config_value() {
            local config_name="$1"
            local config_value="$2"
            if grep -q "^${config_name}=" "${CONFIG_FILE}"; then
              sed -i "s/^${config_name}=.*/${config_name}=${config_value}/" "${CONFIG_FILE}"
            elif grep -q "^# ${config_name} is not set" "${CONFIG_FILE}"; then
              sed -i "s/^# ${config_name} is not set/${config_name}=${config_value}/" "${CONFIG_FILE}"
            else
              echo "${config_name}=${config_value}" >> "${CONFIG_FILE}"
            fi
          }
          
          # 开启 KSU 和 SUSFS
          set_config_value CONFIG_KSU y
          set_config_value CONFIG_KSU_SUSFS y
          if grep -q 'config KSU_SUSFS_HAS_MAGIC_MOUNT' KernelSU/kernel/Kconfig; then
            set_config_value CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT y
          fi
          
          make "${MAKE_ARGS[@]}" olddefconfig
          
          if ! grep -q '^CONFIG_KSU=y' "${CONFIG_FILE}" || ! grep -q '^CONFIG_KSU_SUSFS=y' "${CONFIG_FILE}"; then
            echo "ERROR: KSU or SUSFS config is missing."
            exit 1
          fi
          
          # 多核极速编译
          make "${MAKE_ARGS[@]}" -j"$(nproc)"

      # 9. 用 AnyKernel3 制作卡刷包
      - name: Pack with AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          rm -rf .git README.md *placeholder
          
          sed -i -E 's/^[[:space:]]*do\.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          sed -i -E 's/^[[:space:]]*(BLOCK|block)=.*/BLOCK=\/dev\/block\/bootdevice\/by-name\/boot;/' anykernel.sh
          sed -i -E 's/^[[:space:]]*(IS_SLOT_DEVICE|is_slot_device)=.*/IS_SLOT_DEVICE=1;/' anykernel.sh
          
          OUT_DIR="${GITHUB_WORKSPACE}/out"
          if [ -f "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image.gz-dtb" ./
          elif [ -f "${OUT_DIR}/arch/arm64/boot/Image" ]; then
            cp "${OUT_DIR}/arch/arm64/boot/Image" ./
          else
            echo "ERROR: Kernel image was not found."
            exit 1
          fi

      # 10. 上传成品
      - name: Upload Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lineage-SukiSU-SUSFS-Kernel
          path: AnyKernel3/*
